AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  nicktillinghast.com, the site itself. Deployed by GitHub Actions on every push
  to main (stack name nicktillinghast-app). CloudFront in front of the private
  S3 bucket from bootstrap.yml. Creates no IAM roles.

Parameters:
  DomainName:
    Type: String
    Default: nicktillinghast.com

Resources:
  # Runs on every request: sends www to the bare domain, and maps clean URLs to the
  # files Astro builds (/work/house-of-horrors -> /work/house-of-horrors/index.html)
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: nicktillinghast-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect + index.html rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : "";

          if (host.indexOf("www.") === 0) {
            var query = [];
            for (var key in request.querystring) {
              var param = request.querystring[key];
              var values = param.multiValue ? param.multiValue : [param];
              for (var i = 0; i < values.length; i++) {
                query.push(values[i].value === "" ? key : key + "=" + values[i].value);
              }
            }
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: {
                location: {
                  value: "https://" + host.substring(4) + request.uri + (query.length ? "?" + query.join("&") : "")
                }
              }
            };
          }

          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === "/") {
            request.uri = uri + "index.html";
          } else if (uri.split("/").pop().indexOf(".") === -1) {
            request.uri = uri + "/index.html";
          }
          return request;
        }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: nicktillinghast-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: nicktillinghast.com portfolio
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !ImportValue nicktillinghast-certificate-arn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe edges only, the cheapest tier
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !ImportValue nicktillinghast-site-bucket-domain
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": follows the Cache-Control set at upload
          # (HTML rechecks every time, hashed /_astro/ files cache for a year)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed "SecurityHeadersPolicy": HSTS, nosniff, frame and referrer headers
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        # The bucket answers 403 for missing files (CloudFront can't list it), so both
        # map to the site's own 404 page
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # Only this distribution can read the bucket
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue nicktillinghast-site-bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - ${BucketArn}/*
              - BucketArn: !ImportValue nicktillinghast-site-bucket-arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---- DNS: the domain and www point at CloudFront ----

  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue nicktillinghast-hosted-zone-id
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # CloudFront's fixed hosted zone id
        HostedZoneId: Z2FDTNDATAQYW2

  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue nicktillinghast-hosted-zone-id
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue nicktillinghast-hosted-zone-id
      Name: !Sub www.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue nicktillinghast-hosted-zone-id
      Name: !Sub www.${DomainName}
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
